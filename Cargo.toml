[package]
name = "jev-cc"
version = "0.1.0"
edition = "2024"
description = "Prefixes commit messages with Conventional Commits syntax using TypeSafe's Jev"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
